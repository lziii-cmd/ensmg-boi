services:

  # ── Base de données ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-ensmg_boite_idees}
      POSTGRES_USER:     ${POSTGRES_USER:-ensmg_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ensmg_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery + cache API) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Application Django (Gunicorn auto-adaptatif) ─────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: .env.disi
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-ensmg_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ensmg_boite_idees}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Pas de port exposé directement — Nginx s'en charge

  # ── Celery worker ─────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file: .env.disi
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-ensmg_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ensmg_boite_idees}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx (reverse proxy + fichiers statiques) ────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/app/media:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
